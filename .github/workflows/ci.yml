name: HARBOR CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @harbor/solver exec wrangler deploy --dry-run --outdir .wrangler/dryrun
      - run: pnpm --filter @harbor/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Check no obvious credentials committed
        shell: bash
        run: |
          if git grep -nE '(SUPABASE_SERVICE_ROLE_KEY|SOLVER_ALPHA_PRIVATE_KEY|SOLVER_BRAVO_PRIVATE_KEY)=[^[:space:]]+' -- ':!*.example'; then
            echo "Possible credential assignment committed"; exit 1
          fi

      - name: Package exact source from verified commit
        run: git archive --format=zip --output harbor-source.zip HEAD
      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: harbor-source-${{ github.sha }}
          path: harbor-source.zip
          if-no-files-found: error
          retention-days: 30
