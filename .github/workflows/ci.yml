name: HARBOR CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Check no obvious credentials committed
        shell: bash
        run: |
          if git grep -nE '(SUPABASE_SERVICE_ROLE_KEY|SOLVER_ALPHA_PRIVATE_KEY|SOLVER_BRAVO_PRIVATE_KEY)=[^[:space:]]+' -- ':!*.example'; then
            echo "Possible credential assignment committed"; exit 1
          fi
